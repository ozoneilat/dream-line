media:
  input: assets
  output: /assets

content:
  - name: site
    label: Настройки сайта
    type: file
    path: content/site.json
    format: json
    fields:
      - name: brand
        label: Название бренда
        type: string
      - name: headline
        label: Заголовок
        type: string
      - name: intro
        label: Вступительный текст
        type: text
      - name: button_text
        label: Текст кнопки
        type: string
      - name: button_url
        label: Ссылка кнопки
        type: string
      - name: video_url
        label: Ссылка на видео
        type: string
      - name: rules_title
        label: Заголовок правил
        type: string
      - name: rules_text
        label: Текст правил
        type: text
      - name: footer_text
        label: Текст внизу сайта
        type: string
